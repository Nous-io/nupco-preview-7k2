<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUPCO Digital Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2346; --navy2:#262E58; --navy3:#343D6E;
  --red:#E3151C; --orange:#E06E0E;
  --grad:linear-gradient(90deg,#E3151C 0%,#E06E0E 100%);
  --wgrad:linear-gradient(90deg,#24D6CC 0%,#5D00B2 100%);
  --bg:#EEEEF2; --card:#FFFFFF;
  --ink:#1C2346; --ink2:#535A7C; --muted:#8C90A8; --line:#E7E8EF; --soft:#F5F5F8;
  --pos:#52B926; --neu:#A3A6B8; --neg:#E3151C;
  --bN:#E06E0E; --bW:#5D00B2;
  --font:"Co Headline","Rubik",Tahoma,Verdana,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#D9DAE2;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{width:1765px;height:900px;position:absolute;left:0;top:0;transform-origin:0 0;display:flex;background:var(--bg);overflow:hidden}
button{font-family:inherit}

/* sidebar */
.side{width:224px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:26px 18px 18px;position:relative;overflow:hidden}
.side .logo{width:132px;display:block;margin:0 0 6px 4px}
.side .prod{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#AEB3D1;margin:4px 0 24px 6px}
.nav{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:13.5px;font-weight:500;color:#C9CCE2;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(227,21,28,.3)}
.side h6{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7F86B0;font-weight:500;margin:24px 0 9px 6px;position:relative;z-index:1}
.brands{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.brands button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:1px solid var(--navy3);font-size:12.5px;color:#C9CCE2}
.brands button .bd{width:22px;height:14px;border-radius:4px 6px 4px 6px;transform:skewX(-10deg) rotate(10deg);flex:none}
.brands button small{margin-left:auto;font-size:10.5px;color:#7F86B0}
.brands button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.brands button.on small{color:var(--muted)}
.flt{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.sel{display:flex;justify-content:space-between;align-items:center;background:var(--navy2);border:1px solid var(--navy3);border-radius:10px;padding:8px 11px;font-size:12px;color:#E4E6F3}
.sel span{color:#8E95BE;font-size:10.5px;display:block;margin-bottom:2px}
.sel svg{width:12px;height:12px;stroke:#8E95BE;fill:none;stroke-width:2}
.lbl{font-size:10.5px;color:#8E95BE;margin:4px 0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:5px 9px;border-radius:20px;border:1px solid var(--navy3);color:#C9CCE2;cursor:pointer;user-select:none}
.chip.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:500}
.side .foot{margin-top:auto;position:relative;z-index:1;font-size:10.5px;color:#8087B3;line-height:1.55;padding-left:6px}
.side .foot b{color:#fff;font-weight:500}
.side .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:6px;box-shadow:0 0 0 3px rgba(82,185,38,.25)}
.loz{position:absolute;pointer-events:none}

/* main */
.main{flex:1;padding:20px 22px 20px;display:flex;flex-direction:column;min-width:0}
.top{height:52px;display:flex;align-items:center;gap:12px;margin-bottom:14px;flex:none}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.top h1 i{width:22px;height:16px;display:inline-block;background:var(--grad);border-radius:5px 7px 5px 7px;transform:skewX(-10deg) rotate(10deg)}
.top p{font-size:12px;color:var(--ink2);margin-top:3px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{background:#fff;border-radius:11px;padding:8px 13px;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(28,35,70,.06)}
.pill b{color:var(--ink);font-weight:500}
.pill svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:1.8}
.seg{display:flex;background:#fff;border-radius:11px;padding:3px;box-shadow:0 1px 2px rgba(28,35,70,.06)}
.seg span{font-size:12px;padding:6px 11px;border-radius:8px;color:var(--ink2);cursor:pointer}
.seg span.on{background:var(--navy);color:#fff}
.sample{font-size:10.5px;color:var(--orange);border:1px dashed var(--orange);border-radius:8px;padding:5px 8px}
.bchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;background:#fff;border-radius:20px;padding:4px 10px 4px 8px;margin-left:6px;box-shadow:0 1px 2px rgba(28,35,70,.08);vertical-align:3px}
.bchip i{width:10px;height:10px;border-radius:3px;display:inline-block}

.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 318px;gap:14px}
.wrap.col{grid-template-columns:1fr 46px}
.wrap.home{grid-template-columns:1fr}
.wrap.home .ins{display:none}
.ins .tg{all:unset;cursor:pointer;margin-left:auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);border:1px solid #F0CDB4;background:#fff}
.ins .tg:hover{border-color:var(--navy);color:var(--navy)}
.ins .tg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ins .rail{display:none;flex:1;flex-direction:column;align-items:center;gap:12px;padding:14px 0;cursor:pointer}
.wrap.col .ins .hd,.wrap.col .ins .list,.wrap.col .ins .drawer{display:none}
.wrap.col .ins .rail{display:flex}
.rail .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.rail .ct{font-size:10.5px;background:var(--navy);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:600}
.rail .bar{width:4px;height:18px;border-radius:3px;background:var(--grad)}
.rail .dots{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.rail .dots span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.rail .dots svg{width:12px;height:12px}
/* home */
#p-home{grid-template-rows:300px 236px 1fr}
.lhero{grid-column:span 7;background:var(--navy);border-radius:18px;color:#fff;padding:28px 32px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.lhero::after{content:"";position:absolute;right:-70px;top:-50px;width:330px;height:210px;background:var(--hg,var(--grad));border-radius:46px 62px 46px 62px;transform:rotate(-10deg) skewX(-10deg);opacity:.95}
.lhero .lz{position:absolute;right:30px;bottom:-60px;width:300px;height:170px;border:1.4px solid #E06E0E;border-radius:40px 56px 40px 56px;transform:rotate(-10deg) skewX(-10deg);opacity:.45}
.lhero > *{position:relative;z-index:1}
.lhero .gr{font-size:13px;color:#AEB3D1}
.lhero h2{font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:8px;line-height:1.15;max-width:520px}
.lhero p{font-size:13px;color:#C9CCE2;margin-top:10px;max-width:470px;line-height:1.55}
.lhero .bsel{display:flex;gap:10px;margin-top:auto}
.lhero .bsel button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;border:1px solid var(--navy3);font-size:13px;color:#E4E6F3;background:rgba(255,255,255,.04)}
.lhero .bsel button .bd{width:22px;height:14px;border-radius:4px 6px 4px 6px;transform:skewX(-10deg) rotate(10deg)}
.lhero .bsel button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.glance{grid-column:span 5;display:flex;flex-direction:column}
.glance .gg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gt{background:var(--soft);border-radius:13px;padding:13px 15px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.gt .l{font-size:11.5px;color:var(--ink2)}
.gt .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.gt .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.gt .d{font-size:11px;font-weight:500;padding:2px 6px;border-radius:6px}
.gt .d.up{color:#2F7D12;background:#EAF6E3}.gt .d.bad{color:#B4101A;background:#FCE8E9}
.gt .sb{font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{grid-column:span 4;cursor:pointer;transition:box-shadow .15s,transform .15s}
.pc:hover{box-shadow:0 2px 4px rgba(28,35,70,.06),0 14px 34px rgba(28,35,70,.12);transform:translateY(-2px)}
.pc .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--navy)}
.pc .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pc h4{font-size:16px;font-weight:600;margin-top:12px}
.pc .ds{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.5}
.pc .st{display:flex;gap:22px;margin-top:auto;align-items:flex-end}
.pc .st div span{font-size:10.5px;color:var(--muted);display:block}
.pc .st div b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.pc .go{margin-left:auto;font-size:12px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pc .go i{width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.tk{grid-column:span 12}
.tk .tkg{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:0}
.tkc{border:1px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.tkc:hover{border-color:var(--navy)}
.tkc .pgl{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tkc .tl{font-size:13px;font-weight:600;line-height:1.35}
.tkc .mt{display:flex;align-items:baseline;gap:6px}
.tkc .mt b{font-size:20px;font-weight:600}
.tkc .mt span{font-size:11px;color:var(--muted)}
.tkc p{font-size:11.5px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tkc p em{font-style:normal;color:var(--ink);font-weight:500}
.pages{min-height:0;display:flex}
.page{flex:1;min-height:0;display:none;gap:14px;grid-template-columns:repeat(12,1fr)}
.page.on{display:grid}
#p-overview{grid-template-rows:88px 356px 1fr}
#p-social{grid-template-rows:88px 262px 1fr}
#p-crisis{grid-template-rows:88px 368px 1fr}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}

.card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(28,35,70,.05),0 8px 24px rgba(28,35,70,.05);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:none;min-height:24px}
.ch h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ch h3::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--grad)}
.ch .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:600;font-style:italic;font-family:Georgia,serif;flex:none}
.ib:hover,.card.info .ib{background:var(--navy);color:#fff;border-color:var(--navy)}
.infobox{position:absolute;left:0;right:0;top:48px;bottom:0;background:rgba(255,255,255,.97);padding:6px 18px 14px;z-index:5;display:none;overflow:auto;font-size:12px;line-height:1.5;color:var(--ink2)}
.card.info .infobox{display:block}
.infobox h4{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:10px 0 3px}
.infobox p{color:var(--ink)}
.infobox code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:var(--soft);padding:1px 5px;border-radius:4px;color:var(--navy)}
.infobox .na{margin-top:10px;padding:8px 10px;border-radius:9px;background:#FDF0E5;color:#8A4A0B;font-size:11.5px}
.tabs{display:flex;background:var(--soft);border-radius:9px;padding:2px}
.tabs span{font-size:11px;padding:4px 9px;border-radius:7px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs span.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(28,35,70,.1)}
.lg{display:flex;gap:12px;font-size:11px;color:var(--ink2);align-items:center;white-space:nowrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg i.ln{height:3px;border-radius:2px;width:14px;vertical-align:2px}
.body{flex:1;min-height:0;position:relative}

/* kpis */
.kpis{display:grid;gap:14px;grid-column:span 12}
.kpi{background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 1px 2px rgba(28,35,70,.05),0 8px 24px rgba(28,35,70,.05);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-width:0}
.kpi .l{font-size:11.5px;color:var(--ink2)}
.kpi .v{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi .d{font-size:11px;font-weight:500;padding:2px 6px;border-radius:6px}
.kpi .d.up{color:#2F7D12;background:#EAF6E3}.kpi .d.dn,.kpi .d.bad{color:#B4101A;background:#FCE8E9}
.kpi .cmp{font-size:10.5px;color:var(--muted);margin-left:5px;white-space:nowrap}
.kpi .split{font-size:10.5px;color:var(--ink2);margin-top:6px;display:flex;gap:10px;white-space:nowrap}
.kpi .split i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.kpi.hero{background:var(--navy);color:#fff}
.kpi.hero .l{color:#AEB3D1}.kpi.hero .cmp,.kpi.hero .split{color:#AEB3D1}
.kpi.hero .d.up{background:rgba(82,185,38,.2);color:#8BE065}
.kpi.hero .d.dn{background:rgba(227,21,28,.25);color:#FF9A9E}
.kpi.hero::after{content:"";position:absolute;right:-30px;top:-26px;width:110px;height:72px;background:var(--hg,var(--grad));border-radius:22px 30px 22px 30px;transform:rotate(-10deg) skewX(-10deg);opacity:.95}
.kpi.hero > *{position:relative;z-index:1}
.spark{width:76px;height:30px;flex:none}

/* drivers timeline */
.drv{display:grid;gap:10px;flex:none;margin-top:8px}
.dc{border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;transition:border-color .15s,box-shadow .15s}
.dc:hover,.dc.on{border-color:var(--navy);box-shadow:0 4px 14px rgba(28,35,70,.1)}
.dc .h{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);white-space:nowrap}
.nb{width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;flex:none}
.dc .h b{color:var(--ink);font-weight:600}
.dc .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.mixl{display:flex;gap:8px;font-size:10px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.mixl i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px}
.dc .who{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* posts */
.feed{display:flex;flex-direction:column;overflow:hidden}
.po{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.po:last-child{border-bottom:0}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;flex:none}
.po .x{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.po .a{display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;min-width:0}
.po .a b{font-weight:600}.po .a .h{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.pf{font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pt{font-size:12px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
[dir=rtl]{font-family:Tahoma,"Rubik",sans-serif}
.pm{display:flex;gap:11px;font-size:11px;color:var(--ink2);align-items:center;white-space:nowrap}
.pm svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:1.8;vertical-align:-2px;margin-right:3px}
.sp{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:6px;white-space:nowrap}
.sp.pos{background:#EAF6E3;color:#2F7D12}.sp.neg{background:#FCE8E9;color:#B4101A}.sp.neu{background:#EFF0F4;color:#5B6080}
.bt{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.ml{margin-left:auto}

/* news */
.hi{padding:8px 0;border-bottom:1px solid var(--line)}
.hi:last-child{border-bottom:0}
.hi .src{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.hi .src b{color:var(--ink);font-weight:600}
.hi .tt{font-size:12px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bl{display:flex;flex-direction:column;gap:7px}
.br{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:8px;font-size:11.5px}
.br .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .t{height:8px;border-radius:4px;display:flex;gap:2px;overflow:hidden}
.br .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}

/* tables */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-size:10.5px;color:var(--muted);font-weight:500;text-align:left;padding:0 8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ell{max-width:320px;overflow:hidden;text-overflow:ellipsis}
.na{color:var(--muted)}
.rk{font-weight:600;color:var(--muted)}
.inbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.inbar span{display:block;height:7px;border-radius:4px}

/* insights */
.ins{background:#FCEEE3;border:1px solid #F5DCC9;border-radius:16px;box-shadow:0 1px 2px rgba(28,35,70,.05),0 8px 24px rgba(28,35,70,.05);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.ins .hd{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #F3D6C1}
.ins .hd h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}

.xact svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vf{width:15px;height:15px;border-radius:50%;background:#1D9BF0;color:#fff;font-size:9px;display:inline-grid;place-items:center;flex:none;font-weight:700}
.egr{padding:7px 0}.egn b{font-size:13px}
.mh img.avi{width:44px;height:44px}
.wp,.fhp{display:flex;gap:10px;align-items:flex-start}.wpx{flex:1;min-width:0}
.wp .av,.fhp .av{width:30px;height:30px;font-size:10.5px}
.vpos{white-space:nowrap;font-size:13px;font-weight:500;color:#2F7D12;margin-left:6px;letter-spacing:0}
.tbv{display:inline-flex;align-items:center;gap:8px}.tbv svg{flex:none}
.kx .row{align-items:flex-end;gap:12px}
.tbn{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.tbs{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--ink2);white-space:nowrap}
.tbs b{color:var(--ink);font-weight:600}
.tbbar{flex:1;max-width:90px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}.tbbar i{display:block;height:100%;border-radius:3px}
.alv{display:flex;align-items:baseline;gap:5px}.alv b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}.alv span{font-size:12px;color:var(--muted)}
.alb{margin-left:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.alb span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--ink);white-space:nowrap}
.alb i{width:7px;height:7px;border-radius:50%;display:inline-block}
</style>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const fmt=n=>n==null?'n/a':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('en-US');
const sum=a=>a.reduce((x,y)=>x+y,0);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const tip=$('#tip');
function showTip(e,h){tip.innerHTML=h;tip.style.opacity=1;const w=tip.offsetWidth,hh=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+hh>innerHeight-8)y=e.clientY-hh-14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t)showTip(e,t.dataset.tip);else if(!e.target.closest('.xhair'))hideTip()});
const ICON={
 heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>',
 rt:'<svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
 eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
 msg:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>',
 win:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m4 15 5-5 4 4 7-7"/><path d="M15 7h5v5"/></svg>',
 watch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 risk:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/></svg>',
 info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>'
};
const TAGN={win:'Win',watch:'Watch',risk:'Risk',info:'Context'};
const SENT={pos:['Positive','#52B926'],neu:['Neutral','#A3A6B8'],neg:['Negative','#E3151C']};
/* post types: navy ramp (ordered, one hue) */
const PTYPE={'Original posts':'#1C2346','Replies':'#4D5895','Quotes':'#8D95C6','News articles':'#E0B48C'};
const days=[];{const d0=new Date(2026,9,5);for(let i=0;i<30;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);days.push(d.getDate()+' '+d.toLocaleString('en-GB',{month:'short'}))}}

function spark(data,color){const w=76,h=30,mn=Math.min(...data),mx=Math.max(...data);const p=data.map((v,i)=>[i/(data.length-1)*w,h-3-(v-mn)/(mx-mn||1)*(h-6)]);const d='M'+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L');
 return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${p.at(-1)[0]-1.5}" cy="${p.at(-1)[1]}" r="2.6" fill="${color}"/></svg>`}
function delta(cur,prev,badUp){const d=prev?(cur-prev)/prev*100:0;const up=d>=0;return {txt:(up?'▲ ':'▼ ')+Math.abs(d).toFixed(0)+'%',cls:badUp?(up?'bad':'up'):(up?'up':'dn')}}
function kpi(o){const sp=o.s&&!o.split?spark(o.s,o.hero?'#fff':(o.col||'#1C2346')):'';
 return `<div class="kpi ${o.hero?'hero':''}" style="${o.hg?'--hg:'+o.hg:''}"><div class="l">${o.l}</div><div class="row"><div style="min-width:0"><div class="v">${o.v}</div>${o.split?`<div class="split">${o.split}</div>`:`<div style="margin-top:7px"><span class="d ${o.dc}">${o.d}</span><span class="cmp">${o.c||'vs prev.'}</span></div>`}</div>${sp}</div></div>`}

/* line chart with crosshair, band and numbered markers */
function lineChart(el,{labels,series,markers=[],band,yFmt=fmt,tick0,yMaxPad=1.12,onMark}){
 const W=el.clientWidth,H=el.clientHeight,m={l:36,r:12,t:14,b:20},iw=W-m.l-m.r,ih=H-m.t-m.b;
 const all=series.flatMap(s=>s.data).concat(band?band.hi:[]);const mx=Math.max(...all)*yMaxPad;
 const step=Math.pow(10,Math.floor(Math.log10(mx/4)));const tick=tick0||[1,2,2.5,5,10].map(k=>k*step).find(t=>mx/t<=4);const top=Math.ceil(mx/tick)*tick;
 const X=i=>m.l+i/(labels.length-1)*iw,Y=v=>m.t+ih-v/top*ih;

 for(let v=0;v<=top;v+=tick){s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEEFF4"/><text x="${m.l-8}" y="${Y(v)+3.5}" font-size="10" fill="#8C90A8" text-anchor="end">${yFmt(v)}</text>`}

const lozSVG=(g,sz)=>{const id='lg'+Math.random().toString(36).slice(2,7);const stops=g.match(/#[0-9A-Fa-f]{6}/g)||['#E06E0E','#E3151C'];return `<svg viewBox="0 0 40 40" width="${sz}" height="${sz}"><defs><linearGradient id="${id}" x1="0" x2="1">${stops.map((c,k)=>`<stop offset="${k/(stops.length-1||1)}" stop-color="${c}"/>`).join('')}</linearGradient></defs><path d="${LOZ(20,20,15)}" fill="url(#${id})"/></svg>`};
const LOZ=(cx,cy,r)=>{const w=r*1.2,h=r*.95,k=r*.5;const p=[[-w,-h*.55],[w*.82,-h],[w,h*.55],[-w*.82,h]].map(([x,y])=>{const a=-.17,c=Math.cos(a),s2=Math.sin(a);return [cx+x*c-y*s2,cy+x*s2+y*c]});let d='';for(let q=0;q<4;q++){const a=p[q],b=p[(q+1)%4],z=p[(q+3)%4];const t=(u,v,f)=>[u[0]+(v[0]-u[0])*f,u[1]+(v[1]-u[1])*f];const f1=k/Math.hypot(b[0]-a[0],b[1]-a[1]),f0=k/Math.hypot(z[0]-a[0],z[1]-a[1]);const s1=t(a,z,f0),e1=t(a,b,f1);d+=(q?'L':'M')+s1[0].toFixed(1)+','+s1[1].toFixed(1)+'Q'+a[0].toFixed(1)+','+a[1].toFixed(1)+' '+e1[0].toFixed(1)+','+e1[1].toFixed(1)}return d+'Z'};
const avatar=(p,big)=>{const cls='av'+(big?' avb':'');if(p.kind!=='news'&&AV[p.h])return `<img class="${cls} avi" src="${AV[p.h]}" alt="">`;if(p.own)return `<span class="${cls} avo">${lozSVG(BR[p.b].g,big?26:20)}</span>`;const nm=p.kind==='news'?p.o:p.a;const ini=nm.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<span class="${cls}" style="background:#1C2346">${ini}</span>`};

 if(p.kind==='news')return `<div class="xp" data-k="${opts.k}"><div class="xl">${avatar(p,1)}</div><div class="xr"><div class="xh"><b>${p.o}</b><span class="xs">News · ${days[p.d]}${opts.brand?' · '+BR[p.b].n:''}</span><span class="ml xsrc">${NI}</span></div><div class="xt xnt" ${p.rtl?'dir="rtl"':''}>${p.t}</div><div class="xtags">${p.fh?fhTag():''}${caseSet.has(p.topic)?caseTag():''}<span class="sw ${p.s}">${SENT[p.s][0]}</span><span class="ml xread">Read article ↗</span></div></div></div>`;
 return `<div class="xp" data-k="${opts.k}"><div class="xl">${avatar(p,1)}</div><div class="xr"><div class="xh"><b>${p.a}</b>${vtick(p.h)}<span class="xs">${p.h} · ${days[p.d]}${opts.brand?' · '+BR[p.b].n:''}</span><span class="ml xsrc">${XI}</span></div>${p.reply?`<div class="xrep">Replying to <span>${p.reply}</span></div>`:''}<div class="xt" ${p.rtl?'dir="rtl"':''}>${p.t}</div><div class="xtags">${p.fh?fhTag():''}${caseSet.has(p.topic)?caseTag():''}<span class="sw ${p.s}">${SENT[p.s][0]}</span></div><div class="xact"><span>${XA.rep}${fmt(p.c)}</span><span>${XA.rt}${fmt(p.r)}</span><span>${XA.lk}${fmt(p.l)}</span><span>${XA.sh}</span></div></div></div>`}

function brandInsights(b,drv){

 if(best)out.push({ty:'win',t:best.t,m:best.dlt.split(' ')[0],mu:'mentions vs a typical day',b:`${best.who}. The best day of the period for ${B.n}.`,a:[['Show what drove it','drv:'+drv.indexOf(best)]]});
 if(negT&&negT[2]<0)out.push({ty:'watch',t:`${negT[0]} is the most negative topic`,m:String(negT[2]),mu:'net sentiment',b:`<em>${fmt(negT[1])} posts</em>, ${negT[3]>0?'up':'down'} ${Math.abs(negT[3])}% vs the previous period.`,a:[['See the posts','topic:'+negT[0]]]});
 if(growT)out.push({ty:'info',t:`${growT[0]} is growing fastest`,m:'+'+growT[3]+'%',mu:'vs previous period',b:`Net sentiment ${growT[2]>0?'+':''}${growT[2]} on ${fmt(growT[1])} posts.`,a:[['See the posts','topic:'+growT[0]]]});
 if(regs.length&&regs[0][1][1]<0)out.push({ty:'watch',t:`${regs[0][0]} is the most negative region`,m:String(regs[0][1][1]),mu:'net sentiment',b:`Most positive: <em>${regs.at(-1)[0]}</em> (${regs.at(-1)[1][1]>0?'+':''}${regs.at(-1)[1][1]}).`,a:[['Show on map','geo:sent']]});

 $('#ins-list').innerHTML=list.map(x=>`<div class="it"><span class="tag ${x.ty}">${ICON[x.ty]}${TAGN[x.ty]}</span><div class="tl">${x.t}</div>${x.m?`<div class="mt"><b>${x.m}</b><span>${x.mu}</span></div>`:''}<p>${x.b}</p>${x.a.length?`<div class="ac">${x.a.map(a=>`<button data-a="${a[1]}">${a[0]}</button>`).join('')}</div>`:''}</div>`).join('');
 $('#ins-list').querySelectorAll('button').forEach(bt=>bt.onclick=()=>act(bt.dataset.a));
}
function act(a){const i=a.indexOf(':'),k=a.slice(0,i),v=a.slice(i+1);
 if(k==='go')go(v);
 if(k==='drv'){const c=document.querySelectorAll('#page .dc')[+v];c&&c.click()}
 if(k==='topic'){const st=S.page==='alerts'?S.alertsFeed:S.feed;st.topic=v;st.sent='all';const r=[...document.querySelectorAll('#page .tpr')].find(x=>x.dataset.t===v);if(r&&!r.classList.contains('on'))r.click();else{const fd=$('#fd');fd&&mountFeed(fd,allItems(brandsFor(S.page)),st,{brand:!isBrand(S.page)})}flash('#fd')}
 if(k==='geo'){const s=document.querySelector(`#geo-tab span[data-v="${v}"]`);s&&s.click();flash('#geo')}
}
function flash(sel){const c=document.querySelector(sel)?.closest('.card');if(!c)return;c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}

/* ================= pop-ups ================= */
function openModal(h){$('#modal').innerHTML=h;$('#mback').classList.add('on');$('#modal').querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);hideTip()}
function closeModal(){$('#mback').classList.remove('on')}
$('#mback').addEventListener('click',e=>{if(e.target.id==='mback')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const bchip=b=>`<span class="bchip" style="margin-left:0;box-shadow:none;background:var(--soft)"><i style="background:${BR[b].c}"></i>${BR[b].n}</span>`;
function openPost(p,back){const it=p.l+p.r+p.c;const tg=DRV[p.b].find(x=>Math.abs(x.i-p.d)<=1&&(x.sent===p.s||x.sent==='neu'));
 openModal(`<div class="mh">${avatar(p,1)}<div><b>${p.a} ${vtick(p.h)}</b><span class="h">${p.h} · ${days[p.d]} 2026 · X</span></div><button class="mx" data-close title="Close">×</button></div>
 <div class="mb"><div class="tags"><span class="pf">${p.tp}</span>${p.own?'<span class="pf">Own account</span>':''}<span class="sp ${p.s}">${SENT[p.s][0]}</span>${bchip(p.b)}${p.topic?`<span class="ttag ${caseSet.has(p.topic)?'cs':''}">${p.topic}</span>`:''}</div>
 ${p.reply?`<div style="font-size:12px;color:var(--muted);margin-bottom:6px">Replying to ${p.reply}</div>`:''}
 <div class="full" ${p.rtl?'dir="rtl"':''}>${p.full||p.t}</div>
 <div class="mm"><div><span>Likes</span><b>${fmt(p.l)}</b></div><div><span>Reposts</span><b>${fmt(p.r)}</b></div><div><span>Replies</span><b>${fmt(p.c)}</b></div><div><span>Interactions</span><b>${fmt(it)}</b></div></div>
 ${tg?`<div class="ctx">Part of the <b>${tg.t}</b> trigger (${days[tg.i]}).</div>`:''}</div>
 <div class="mf">${back?'<button class="btn sec" data-back>← Back to trigger</button>':'<span class="meta">Source: captured top post on X</span>'}<span class="ml"></span><button class="btn sec" data-close>Close</button><a class="btn pri" href="#" onclick="return false">Open on X ↗</a></div>`);if(back)$('#modal [data-back]').onclick=back}
function openNews(n,back){openModal(`<div class="mh"><span class="av" style="background:#1C2346">${n.o.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><div><b>${n.o}</b><span class="h">News article · ${days[n.d]} 2026</span></div><button class="mx" data-close title="Close">×</button></div>
 <div class="mb"><div class="tags"><span class="pf">News &amp; blogs</span><span class="sp ${n.s}">${SENT[n.s][0]}</span>${bchip(n.b)}${n.topic?`<span class="ttag ${caseSet.has(n.topic)?'cs':''}">${n.topic}</span>`:''}</div>
 <div class="full" ${n.rtl?'dir="rtl"':''} style="font-weight:600;font-size:${n.rtl?19:18}px;line-height:1.5">${n.t}</div>
 ${n.sum?`<div class="full" ${n.rtl?'dir="rtl"':''} style="font-size:${n.rtl?15:14}px;color:var(--ink2);margin-top:10px">${n.sum}</div>`:''}</div>
 <div class="mf">${back?'<button class="btn sec" data-back>← Back to trigger</button>':'<span class="meta">Source: News &amp; Blogs, article as captured</span>'}<span class="ml"></span><button class="btn sec" data-close>Close</button><a class="btn pri" href="#" onclick="return false">Read article ↗</a></div>`);if(back)$('#modal [data-back]').onclick=back}
function openDrivers(d,k){
 document.querySelectorAll('#page .dc').forEach((c,i)=>c.classList.toggle('on',i===k));
 const posts=POSTS.filter(p=>p.b===d.b&&Math.abs(p.d-d.i)<=1&&(d.sent==='neu'||p.s===d.sent)).sort((a,c)=>itemInter(c)-itemInter(a));
 const news=NEWS.filter(n=>n.b===d.b&&Math.abs(n.d-d.i)<=2).slice(0,2);
 const arr=d.arr,from=Math.max(0,d.i-6),to=Math.min(29,d.i+3),seg=arr.slice(from,to+1);
 const W=576,H=86,mx=Math.max(...seg)*1.15,X=i=>26+i/(seg.length-1)*(W-52),Y=v=>H-16-v/mx*(H-26);const col=d.sent==='neg'||S.page==='alerts'?'#E3151C':'#1C2346';
 const path='M'+seg.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join('L');const ti=d.i-from;
 const mini=`<svg width="${W}" height="${H}"><path d="${path}L${X(seg.length-1)},${H-16}L${X(0)},${H-16}Z" fill="${col}" opacity=".08"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>${seg.map((v,i)=>`<text x="${X(i)}" y="${H-3}" font-size="9.5" fill="${i===ti?'#1C2346':'#8C90A8'}" font-weight="${i===ti?600:400}" text-anchor="middle">${days[from+i]}</text>`).join('')}<circle cx="${X(ti)}" cy="${Y(seg[ti])}" r="5" fill="${col}" stroke="#fff" stroke-width="2"/><text x="${X(ti)}" y="${Y(seg[ti])-10}" font-size="11" font-weight="600" fill="#1C2346" text-anchor="middle">${fmt(seg[ti])}</text></svg>`;
 openModal(`<div class="mh"><span class="nb" style="width:36px;height:36px;font-size:15px">${k+1}</span><div><b>${d.t}</b><span class="h">${d.lab} 2026 · ${BR[d.b].n} · ${d.dlt}</span></div><button class="mx" data-close title="Close">×</button></div>
 <div class="mb"><div class="tags"><span class="sp ${d.sent}">${SENT[d.sent][0]}</span>${bchip(d.b)}<span style="font-size:12px;color:var(--ink2)">${d.who}</span></div>
 <div style="border:1px solid var(--line);border-radius:12px;padding:10px 10px 4px">${mini}</div>
 <div class="mlab">What drove it</div>
 <div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px">${d.mix.map(m=>`<i style="flex:${m[1]};background:${PTYPE[m[0]]}" data-tip="${m[0]}: ${m[1]}%"></i>`).join('')}</div>
 <div style="display:grid;grid-template-columns:repeat(${d.mix.length},1fr);gap:8px;margin-top:8px">${d.mix.map(m=>`<div><div style="font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px"><i style="width:8px;height:8px;border-radius:2px;background:${PTYPE[m[0]]};display:inline-block"></i>${m[0]}</div><b style="font-size:17px;font-weight:600">${m[1]}%</b></div>`).join('')}</div>
 <div class="mlab">Posts behind it · click to open</div>
 ${posts.map((p,j)=>`<div class="clk tp-post" data-j="${j}">${miniPost(p)}</div>`).join('')||'<div style="font-size:12px;color:var(--muted);padding:6px 0">No captured X posts for this day.</div>'}
 ${news.map((n,j)=>`<div class="hi clk tp-news" data-j="${j}"><div class="src"><b>${n.o}</b>· news · ${days[n.d]}<span class="sp ${n.s} ml">${SENT[n.s][0]}</span></div><div class="tt" ${n.rtl?'dir="rtl"':''}>${n.t}</div></div>`).join('')}</div>
 <div class="mf"><span class="meta">Post types and posts from what Lucidya captured on that day</span><span class="ml"></span><button class="btn sec" data-close>Close</button></div>`);
 const back=()=>openDrivers(d,k);
 $('#modal').querySelectorAll('.tp-post').forEach(e=>e.onclick=()=>openPost(posts[+e.dataset.j],back));
 $('#modal').querySelectorAll('.tp-news').forEach(e=>e.onclick=()=>openNews(news[+e.dataset.j],back));
}
const miniPost=p=>`<div class="po">${avatar(p)}<div class="x"><div class="a"><b>${p.a}</b><span class="h">${p.h}</span><span class="pf">${p.tp}</span><span class="ml" style="color:var(--muted);font-size:10.5px">${p.ago}</span></div><div class="pt" ${p.rtl?'dir="rtl"':''}>${p.t}</div><div class="pm"><span>${ICON.heart}${fmt(p.l)}</span><span>${ICON.rt}${fmt(p.r)}</span><span>${ICON.msg}${fmt(p.c)}</span><span class="sp ${p.s} ml">${SENT[p.s][0]}</span></div></div></div>`;

/* ================= nav ================= */
function go(p){S.page=p;S.feed={sent:'all',sort:'top',topic:null,src:'all'};
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 const isB=isBrand(p);
 $('#ptitle').textContent=isB?BR[p].n:PTITLE[p][0];
 $('#par').textContent=isB?BR[p].ar:'';
 $('#psub').textContent=isB?BR[p].desc:PTITLE[p][1];
 $('#plz').style.background=isB?BR[p].g:p==='alerts'?'linear-gradient(90deg,#E3151C,#E06E0E)':'linear-gradient(90deg,#E06E0E,#7B3FD1,#2E86D1)';
 $('#pnum').textContent=PAGES.find(x=>x[0]===p)[1];$('#bfil').style.display=p==='alerts'?'flex':'none';
 $('#drawer')?.classList.remove('on');hideTip();
 const ins=isB?brandPage(p):p==='exec'?execPage():alertsPage();
 document.querySelectorAll('#page .card[data-info]').forEach(cardInfo);
 renderInsights(ins);
}
$('#nav').innerHTML=PAGES.map(([p,n])=>{const c=BR[p]?BR[p].c:p==='exec'?'#8E95BE':'#E3151C';const nm=BR[p]?BR[p].n:PTITLE[p][0];return `<button data-p="${p}"><span class="nn">${n}</span><span class="nd" style="background:${c}"></span>${nm}</button>`}).join('');
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
document.querySelectorAll('.chips').forEach(t=>t.addEventListener('click',e=>{const s=e.target.closest('span');if(!s||s.parentNode!==t)return;t.querySelectorAll(':scope>span').forEach(x=>x.classList.toggle('on',x===s))}));
$('#bf-b').onclick=e=>{e.stopPropagation();$('#bf-m').classList.toggle('on')};document.addEventListener('click',()=>$('#bf-m').classList.remove('on'));
$('#bf-m').innerHTML=[['all','All brands','linear-gradient(90deg,#E06E0E,#7B3FD1,#2E86D1)'],...ORD.map(b=>[b,BR[b].n,BR[b].c])].map(([v,n,c])=>`<div data-v="${v}"><span class="bd" style="background:${c}"></span>${n}</div>`).join('');
$('#bf-m').querySelectorAll('div').forEach(d=>d.onclick=e=>{e.stopPropagation();setAB(d.dataset.v)});
document.querySelector('.seg').onclick=e=>{const s=e.target.closest('span');if(!s)return;S.range=s.textContent;document.querySelectorAll('.seg span').forEach(x=>x.classList.toggle('on',x===s));$('#dfrom').textContent=RANGE[S.range].lab;go(S.page)};
function toggleIns(){$('.wrap').classList.toggle('col');go(S.page)}
$('#ins-tg').onclick=toggleIns;$('#ins-rail').onclick=toggleIns;
function fit(){const st=$('#stage');const s=Math.min(innerWidth/1765,innerHeight/900);st.style.transform=`scale(${s})`;st.style.left=Math.max(0,(innerWidth-1765*s)/2)+'px';st.style.top=Math.max(0,(innerHeight-900*s)/2)+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{if(q.get('open'))$('.wrap').classList.remove('col');if(q.get('geo'))S.geo=q.get('geo');if(q.get('r')){S.range=q.get('r');document.querySelectorAll('.seg span').forEach(x=>x.classList.toggle('on',x.textContent===S.range));$('#dfrom').textContent=RANGE[S.range].lab}if(q.get('ab')){S.ab=q.get('ab');$('#bf-l').textContent=BR[S.ab].n;$('#bf-d').style.background=BR[S.ab].c}go(q.get('p')||'nupco');
 if(q.get('drv'))act('drv:'+q.get('drv'));if(q.get('post'))document.querySelectorAll('#page .fi2')[+q.get('post')]?.click();if(q.get('w'))document.querySelectorAll('#page .wp')[+q.get('w')]?.click();if(q.get('info'))document.querySelector(`#page .card[data-info="${q.get('info')}"]`)?.classList.add('info');if(q.get('topic'))act('topic:'+q.get('topic'))});

</script>
</body>
</html>
